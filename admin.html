 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم | Tarek.Dev</title>
  <script>document.documentElement.setAttribute('data-theme','dark');</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-wrap">
    <h1 style="margin-bottom:20px;">رسائل التواصل</h1>

    <form id="loginForm" class="tool-box" style="max-width:420px;margin-bottom:25px;">
      <label for="token">رمز الدخول</label>
      <input id="token" class="field" type="password" autocomplete="off" required>
      <button class="btn primary" type="submit">دخول</button>
    </form>

    <div id="messagesContainer"></div>
  </div>

  <script>
    (function () {
      'use strict';
      var API = 'https://tarek-portofolio-backend.onrender.com';
      var token = '';               // في الذاكرة فقط، ويختفي بإغلاق الصفحة
      var container = document.getElementById('messagesContainer');
      var form = document.getElementById('loginForm');
      var YEAR_MS = 365 * 24 * 3600 * 1000;

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function note(text, color) {
        container.replaceChildren();
        var d = el('div', 'no-msg', text);
        if (color) d.style.color = color;
        container.appendChild(d);
      }
      function authFetch(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
        return fetch(API + path, opts);
      }

      function renderCard(m, card) {
        var d = new Date(m.created_at || m.createdAt);
        var old = !isNaN(d) && (Date.now() - d.getTime() > YEAR_MS);

        var head = el('div', 'msg-header');
        head.appendChild(el('span', 'msg-name', String(m.name || '') + ' (' + String(m.email || '') + ')'));
        head.appendChild(el('span', '', isNaN(d) ? '' : d.toLocaleString('ar-EG')));
        card.appendChild(head);

        card.appendChild(el('div', 'msg-body', String(m.message || '')));

        var foot = el('div', '');
        foot.style.cssText = 'display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap;';
        if (old) {
          var badge = el('span', '', 'أقدم من 12 شهراً: الأفضل حذفها');
          badge.style.color = 'var(--gold-text)';
          badge.style.fontWeight = '700';
          foot.appendChild(badge);
        }
        var del = el('button', 'btn secondary small', 'حذف');
        del.type = 'button';
        del.addEventListener('click', function () {
          if (!window.confirm('حذف هذه الرسالة نهائياً؟')) return;
          del.disabled = true;
          authFetch('/api/messages/' + encodeURIComponent(m._id), { method: 'DELETE' })
            .then(function (res) {
              if (res.status === 401) { note('انتهت الجلسة، ادخل الرمز من جديد.', '#ef4444'); return; }
              return res.json().catch(function () { return {}; }).then(function (data) {
                if (!res.ok || !data.success) throw new Error('fail');
                card.remove();
                if (!container.querySelector('.msg-card')) note('لا توجد رسائل');
              });
            })
            .catch(function () { del.disabled = false; alert('تعذر الحذف، حاول مرة أخرى.'); });
        });
        foot.appendChild(del);
        card.appendChild(foot);
      }

      function load() {
        note('جاري التحميل... قد يستغرق حتى دقيقة إذا كان السيرفر نائماً.');
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, 60000);
        authFetch('/api/messages', { signal: ctrl.signal })
          .then(function (res) {
            if (res.status === 401) { token = ''; note('رمز غير صحيح', '#ef4444'); return null; }
            if (!res.ok) throw new Error(String(res.status));
            return res.json();
          })
          .then(function (data) {
            if (!data) return;
            var list = Array.isArray(data.messages) ? data.messages : [];
            if (!data.success || !list.length) { note('لا توجد رسائل حتى الآن'); return; }
            var frag = document.createDocumentFragment();
            list.forEach(function (m) {
              var card = el('div', 'msg-card');
              renderCard(m, card);
              frag.appendChild(card);
            });
            container.replaceChildren(frag);
          })
          .catch(function () { note('تعذر الاتصال. حاول مرة أخرى بعد قليل.', '#ef4444'); })
          .then(function () { clearTimeout(timer); });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var input = document.getElementById('token');
        token = input.value;
        input.value = '';
        if (token) load();
      });
    })();
  </script>
</body>
